name: ORBIT ARCADE v3 quality gate
on:
  push:
    branches: [master, "feat/arcade-all57-quality-pass-20261102"]
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: |
          node --check arcade-play.js
          node --check arcade-home.js
          node --check arcade-cortex.js
          node --check arcade-kinetic.js
          node --check arcade-strategy.js
          node --check arcade-completion.js
          node --check orbit-nebula-core.js
          node --check orbit-nebula-strike.js
          node --check orbit-vector-core.js
          node --check orbit-vector-render.js
          node --check orbit-vector-game.js
          node --test tests/arcade-health.test.cjs
          node --test tests/nebula-strike.test.cjs
          node --test tests/nebula-boss-reachability.test.cjs
          node --test tests/vector-run.test.cjs
          node --check tests/vector-visual.cjs
          node --check hyperfold-core.js
          node --check hyperfold-game.js
          node --test tests/hyperfold.test.cjs
  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-save playwright@1.56.1 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 > /tmp/arcade-server.log 2>&1 &
          sleep 2
          node tests/browser-smoke.cjs
          node tests/legacy-audit.cjs
          node tests/vector-playthrough.cjs
          node tests/vector-visual.cjs
          node tests/hyperfold-browser.cjs
          node tests/hyperfold-accessibility.cjs
          node tests/hyperfold-visual.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyperfold-visual-audit
          path: artifacts/hyperfold-visual/*.png
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vector-flight-visual-audit
          path: artifacts/vector-visual/*.png
          if-no-files-found: warn
          retention-days: 14
