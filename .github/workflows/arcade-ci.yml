name: Arcade quality gate
on:
  push:
    branches: [master, "codex/arcade-quality-rebuild-20261102"]
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: |
          node --check arcade-home.js
          node --check arcade-play.js
          node --check arcade-shell.js
          node --test tests/arcade-health.test.cjs
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 > /tmp/arcade-server.log 2>&1 &
          sleep 2
          node tests/browser-smoke.cjs
          node tests/legacy-audit.cjs
