<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081020"><title>ORBIT ARCADE · PLAY</title><link rel="stylesheet" href="arcade-play.css"><script src="arcade-play.js" defer></script>
</head><body data-game="snake-ladder">
<header class="game-top"><a href="index.html">✳ ORBIT / ARCADE</a><div class="top-right"><button id="soundToggle" type="button" aria-pressed="false">静音</button><button id="helpBtn" type="button">操作帮助</button><a href="index.html#library">全部游戏 ↗</a></div></header>
<main class="game-layout"><div class="game-intro"><div><div class="eyebrow">PLAY / REBUILT EDITION</div><h1 id="gameName"></h1><p id="gameSubtitle"></p></div><span id="statusPill" class="status-pill" role="status">准备就绪</span></div>
<div class="game-main"><div><div class="stage-wrap"><canvas id="stage" width="800" height="500" aria-label="游戏主画面"></canvas><div class="overlay" id="overlay"><div class="overlay-box"><div id="overlayKicker" class="overlay-kicker">READY PLAYER ONE</div><h2 id="overlayTitle">准备开启挑战？</h2><p id="overlayDescription">游戏有真正的目标、计分和失败机制。用操作赢得下一局。</p><button class="primary" id="startBtn" type="button">开始挑战 →</button></div></div></div>
<div class="touch-panel" role="group" aria-label="触控操作"><button type="button" data-key="ArrowLeft" aria-label="向左">←</button><button type="button" data-key="ArrowUp" aria-label="向上">↑</button><button type="button" data-key="ArrowDown" aria-label="向下">↓</button><button type="button" data-key="ArrowRight" aria-label="向右">→</button><button type="button" data-key="Space" aria-label="跳跃">跳跃</button></div>
<div class="game-actions"><button type="button" id="pauseBtn">暂停</button><button type="button" id="resetBtn" class="cta">重新挑战 ↻</button><a href="index.html">返回大厅</a></div><p class="live" id="liveFeedback" aria-live="polite">准备好了吗？</p></div>
<aside class="side"><div class="stat-block accent"><label>YOUR SCORE</label><strong id="scoreValue">0</strong></div><div class="stat-block"><label>PROGRESS</label><strong id="levelValue">01</strong></div><div class="stat-block"><label>PERSONAL BEST</label><strong id="bestValue">0</strong></div><div class="instructions"><h2>怎么玩？</h2><p id="gameHint"></p></div></aside></div>
</main><dialog id="helpDialog"><h2>游戏说明</h2><p id="gameInstructions"></p><form method="dialog"><button type="submit">知道了</button></form></dialog></body></html>
