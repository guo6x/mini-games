<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字拼图</title>
    <link rel="stylesheet" href="puzzle.css">
<link rel="stylesheet" href="arcade-shell.css"><script src="arcade-shell.js" defer></script>
